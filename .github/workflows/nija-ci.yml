# Generated by NijaTestAI — Node test CI
name: nija-ci

on:
  push:
    branches:
      - main
      - 'nija/ci-bootstrap/**'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to test
        type: string
        required: true
        default: main
      baseUrl:
        description: Base URL under test
        type: string
        required: false
        default: 

permissions:
  contents: read

concurrency:
  group: nija-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.baseUrl }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-output
          path: |
            reports/
            test-results/
            junit.xml
          retention-days: 14
          if-no-files-found: ignore
